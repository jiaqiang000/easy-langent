# 自动同步上游 datawhalechina/easy-langent 的 main 分支到本 fork
# 触发方式:
#   1. 定时:每 6 小时自动运行一次(可修改下方 cron 调整频率)
#   2. 手动:仓库 Actions 页面点击 "Sync fork from upstream" 工作流 → Run workflow
name: Sync fork from upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本 fork 的 main 分支(全量历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从上游拉取并合并
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/datawhalechina/easy-langent.git
          git fetch upstream main
          git merge upstream/main --no-edit

      - name: 推送回 fork
        run: |
          git push origin main
